name: Suma de Variables de Entorno

on:
  push:
    branches:
      - 'test/**'

jobs:
  sumar_numeros:
    name: Sumar Números
    runs-on: ubuntu-latest
    env:
      NUM1: ${{ vars.NUM1 }}
      NUM2: ${{ vars.NUM2 }}
    outputs:
      resultado: ${{ steps.sumar.outputs.resultado }}
    steps:
      - id: sumar
        name: Realizar Suma
        run: |
          echo "Sumando $NUM1 y $NUM2"
          RESULT=$((NUM1 + NUM2))
          echo "Resultado: $RESULT"
          echo "resultado=$RESULT" >> "$GITHUB_OUTPUT"

  evaluar_resultado:
    name: Evaluar Resultado
    runs-on: ubuntu-latest
    needs: sumar_numeros
    steps:
      - name: Mostrar Mensaje
        run: |
          RESULTADO=${{ needs.sumar_numeros.outputs.resultado }}
          echo "Resultado recibido: $RESULTADO"
          if [ "$RESULTADO" -gt 10 ]; then
            echo "La suma es mayor que 10."
          else
            echo "La suma es menor o igual a 10."
          fi

